services:
  - type: web
    name: document-assess-system
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: document-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: document-approval-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # This value is embedded into the Vite build, so it must be the public
      # URL of the backend service (not the Render dashboard URL).
      - key: VITE_API_BASE_URL
        value: https://document-assess-system.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
